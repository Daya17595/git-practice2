name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required file exists
        run: |
          if [ -f "test.txt" ]; then
            echo "test.txt found - check passed!"
          else
            echo "test.txt missing - failing build!"
            exit 1
          fi

      - name: List all files
        run: ls -la
